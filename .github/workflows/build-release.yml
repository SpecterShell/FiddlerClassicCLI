name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_fiddler_compatibility:
        description: Launch native Fiddler 5.x and 6.x on disposable runners to test the shipped bridge
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  FIDDLER_CLASSIC_VERSION: "6.0.20261.7291"

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      bridge-sha256: ${{ steps.bridge-hash.outputs.sha256 }}
      executable-sha256: ${{ steps.executable-hash.outputs.sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install Fiddler Classic compile reference
        shell: pwsh
        run: ./scripts/install-fiddler-ci.ps1 -Version $env:FIDDLER_CLASSIC_VERSION

      - name: Build release package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
              if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+(?:\.[0-9]+){2}(?:[-.][0-9A-Za-z]+)*)$') {
                  throw "Release tags must use v<major>.<minor>.<patch> with an optional prerelease suffix."
              }

              ./scripts/package.ps1 -Version $matches.version
          }
          else {
              ./scripts/package.ps1
          }

      - name: Exercise single-file release rejection rules
        shell: pwsh
        run: ./scripts/test-release-verifier.ps1

      - name: Test standalone execution and isolated PowerShell installation
        shell: pwsh
        run: ./scripts/test-single-file.ps1

      - name: Test release publication without GitHub writes
        shell: pwsh
        run: ./scripts/test-release-publication.ps1

      - name: Test temporary install, same-version reinstall, and upgrade
        shell: pwsh
        run: ./scripts/test-release-install.ps1

      - name: Record the tested executable digest and extract test-only assets
        id: executable-hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/release/fiddler-classic-cli.exe -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          ./scripts/expand-test-payload.ps1 -Executable artifacts/release/fiddler-classic-cli.exe `
            -Destination artifacts/compatibility-payload -ExpectedSha256 $hash

      - name: Compile the native compatibility probe without running Fiddler
        shell: pwsh
        run: |
          dotnet build ./tests/FiddlerClassicCLI.CompatibilityProbe/FiddlerClassicCLI.CompatibilityProbe.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Compatibility probe compilation failed." }

      - name: Record the single shipped bridge digest
        id: bridge-hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/compatibility-payload/bridge/FiddlerClassicCLI.Bridge.dll -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload release executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fiddler-classic-release
          path: artifacts/release/fiddler-classic-cli.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compatibility:
    name: Shipped bridge on Fiddler ${{ matrix.fiddler-version }}
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pin exact versions verified in microsoft/winget-pkgs.
        # manifests/t/Telerik/Fiddler/Classic/<version>/Telerik.Fiddler.Classic.installer.yaml
        fiddler-version: ['5.0.20253.3311', '6.0.20261.7291']
    steps:
      - name: Check out test harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK for the probe only
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download the same release executable in each job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fiddler-classic-release
          path: artifacts/release

      - name: Install the exact native compatibility reference
        shell: pwsh
        env:
          COMPATIBILITY_FIDDLER_VERSION: ${{ matrix.fiddler-version }}
        run: ./scripts/install-fiddler-ci.ps1 -Version $env:COMPATIBILITY_FIDDLER_VERSION

      - name: Resolve shipped bridge APIs without executing native code
        shell: pwsh
        env:
          COMPATIBILITY_FIDDLER_VERSION: ${{ matrix.fiddler-version }}
          RELEASED_BRIDGE_SHA256: ${{ needs.build.outputs.bridge-sha256 }}
          RELEASED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
        run: |
          ./scripts/test-fiddler-api-compatibility.ps1 `
            -ExpectedFiddlerVersion $env:COMPATIBILITY_FIDDLER_VERSION `
            -ExpectedExecutableSha256 $env:RELEASED_EXECUTABLE_SHA256 `
            -ExpectedBridgeSha256 $env:RELEASED_BRIDGE_SHA256

      - name: Run native lifecycle and synthetic evidence assertions
        if: github.event_name == 'workflow_dispatch' && inputs.run_fiddler_compatibility
        shell: pwsh
        env:
          COMPATIBILITY_FIDDLER_VERSION: ${{ matrix.fiddler-version }}
          RELEASED_BRIDGE_SHA256: ${{ needs.build.outputs.bridge-sha256 }}
          RELEASED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
        run: |
          ./scripts/test-fiddler-compatibility-ci.ps1 -EnableDisposableRunner `
            -ExpectedFiddlerVersion $env:COMPATIBILITY_FIDDLER_VERSION `
            -ExpectedExecutableSha256 $env:RELEASED_EXECUTABLE_SHA256 `
            -ExpectedBridgeSha256 $env:RELEASED_BRIDGE_SHA256
      # Never upload installed native references, profile directories, traffic, or probe build output.

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download tested release executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fiddler-classic-release
          path: artifacts/release

      - name: Test release publication on the publishing platform
        shell: pwsh
        run: ./scripts/test-release-publication.ps1

      - name: Publish verified release executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED_EXECUTABLE_SHA256: ${{ needs.build.outputs.executable-sha256 }}
        run: |
          ./scripts/publish-release.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY `
            -ExpectedSha256 $env:RELEASED_EXECUTABLE_SHA256
